openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: N3PSQAL3 clearinghouse protocol API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile and zodiac operations
  - name: receipts
    description: Near-miss parlay receipt clearinghouse
  - name: search
    description: Refined search engine
  - name: dashboard
    description: Dashboard summaries and activity
  - name: tiers
    description: Subscription tiers and Whop checkout
  - name: payouts
    description: Cash-out rail — Stripe Connect payout accounts and withdrawals
  - name: roqqet
    description: R0QQ3T Agentic Zodiac Systems Assistant
  - name: admin
    description: Operator command center
  - name: Tickets
    description: Machine-to-machine ZETA ticket ingestion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/tickets/ingest:
    post:
      operationId: ingestTicket
      tags: [Tickets]
      summary: Ingest a ZETA AltData ticket
      description: Authenticates machine credentials using either an API key or bearer token.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: x-source-id
          in: header
          required: true
          description: Stable identifier for the ticket source.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^\S.*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketIngestionInput"
      responses:
        "200":
          description: Ticket persisted or an idempotent replay acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestionError"
        "401":
          description: Missing or invalid machine credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestionError"
        "403":
          description: Machine credential is not authorized for the source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestionError"
        "409":
          description: Ticket conflicts with an existing ingestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestionError"
        "413":
          description: Request payload is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestionError"
        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestionError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "422":
          description: Ticket failed semantic validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestionError"
        "500":
          description: Internal ingestion error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIngestionError"
  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Get current user profile
      responses:
        "200":
          description: The current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /me/accept-terms:
    post:
      operationId: acceptTerms
      tags: [profile]
      summary: Record the user's acceptance of the Terms & Conditions
      responses:
        "200":
          description: Updated profile with termsAcceptedAt set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /me/zodiac:
    put:
      operationId: updateZodiac
      tags: [profile]
      summary: Set the Starting 5 zodiac profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZodiacProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      summary: List the current user's receipts
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, verified, under_review, settled, rejected]
        - name: platform
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Submit a near-miss parlay receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "201":
          description: Created receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          description: Invalid receipt (must have 5+ legs with exactly one miss and at least 4 hits; voided legs are allowed and don't count toward hits or misses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Terms & Conditions not yet accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /receipts/{id}:
    get:
      operationId: getReceipt
      tags: [receipts]
      summary: Get a receipt by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /receipts/{id}/settle:
    post:
      operationId: settleReceipt
      tags: [receipts]
      summary: Run settlement on a verified receipt (consumes a daily attempt)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settled receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "402":
          description: No attempts remaining for the current tier today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Terms & Conditions not yet accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Receipt is not in a settleable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /payouts/status:
    get:
      operationId: getPayoutStatus
      tags: [payouts]
      summary: Current user's payout account status
      responses:
        "200":
          description: Payout account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutStatus"
  /payouts/onboard:
    post:
      operationId: onboardPayouts
      tags: [payouts]
      summary: Create (or resume) Stripe Connect onboarding for cash payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutOnboardBody"
      responses:
        "200":
          description: Hosted onboarding link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutOnboardResponse"
        "400":
          description: Invalid return URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /payouts/withdraw:
    post:
      operationId: withdrawPayout
      tags: [payouts]
      summary: Withdraw settled balance as a real cash transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawBody"
      responses:
        "200":
          description: Completed withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawResponse"
        "400":
          description: Invalid amount or payout account not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "402":
          description: Insufficient settled balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Transfer failed at the payment rail (balance refunded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /search:
    get:
      operationId: searchReceipts
      tags: [search]
      summary: Refined search across the user's receipts
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: platform
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, verified, under_review, settled, rejected]
        - name: minLegs
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest, payout_desc, payout_asc, wager_desc]
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Clearinghouse dashboard summary for the current user
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Recent activity feed for the current user
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /tiers:
    get:
      operationId: listTiers
      tags: [tiers]
      summary: List settlement tiers
      responses:
        "200":
          description: Tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tier"
  /whop/checkout:
    post:
      operationId: createCheckout
      tags: [tiers]
      summary: Create a Whop hosted checkout session for a tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: Invalid tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /whop/subscription:
    get:
      operationId: getSubscription
      tags: [tiers]
      summary: Get the current user's verified subscription status
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
  /whop/sync:
    post:
      operationId: syncSubscription
      tags: [tiers]
      summary: Re-verify subscription with Whop after checkout redirect
      responses:
        "200":
          description: Updated subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
  /roqqet/chat:
    post:
      operationId: chatWithRoqqet
      tags: [roqqet]
      summary: Chat with R0QQ3T, the Agentic Zodiac Systems Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
  /roqqet/insight:
    get:
      operationId: getDailyInsight
      tags: [roqqet]
      summary: Daily zodiac-tuned insight from R0QQ3T
      responses:
        "200":
          description: Insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insight"
  /track/visit:
    post:
      operationId: trackVisit
      tags: [dashboard]
      summary: Record an anonymous unique-visitor ping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitPing"
      responses:
        "204":
          description: Recorded
  /ads/serve:
    get:
      operationId: serveAd
      tags: [ads]
      summary: Serve an ad creative for a placement (house/affiliate or network scaffold)
      parameters:
        - name: placement
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ad to render (or network embed config)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdServePayload"
  /ads/{id}/event:
    post:
      operationId: recordAdEvent
      tags: [ads]
      summary: Record an ad impression or click
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdEventInput"
      responses:
        "204":
          description: Recorded
  /admin/ads:
    get:
      operationId: listAds
      tags: [admin]
      summary: List all ad creatives with performance stats
      responses:
        "200":
          description: Ads with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdWithStats"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    post:
      operationId: createAd
      tags: [admin]
      summary: Create an ad creative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdInput"
      responses:
        "201":
          description: Created ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdCreative"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/ads/{id}:
    patch:
      operationId: updateAd
      tags: [admin]
      summary: Update an ad creative (partial)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdUpdate"
      responses:
        "200":
          description: Updated ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdCreative"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Ad not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/command-center:
    get:
      operationId: getCommandCenter
      tags: [admin]
      summary: Operator command center metrics
      responses:
        "200":
          description: Command center metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandCenter"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/settlement-pause:
    post:
      operationId: setSettlementPause
      tags: [admin]
      summary: Pause or resume all automatic settlements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementPause"
      responses:
        "200":
          description: Updated settlement pause state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementPauseState"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/review-queue:
    get:
      operationId: getReviewQueue
      tags: [admin]
      summary: Receipts held for operator integrity review
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueue"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/receipts/{id}/review:
    post:
      operationId: reviewReceipt
      tags: [admin]
      summary: Approve or reject a receipt held for review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: Updated receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Receipt is not under review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/zeta/overview:
    get:
      operationId: getZetaOverview
      tags: [admin]
      summary: Read-only ZETA ingestion overview
      responses:
        "200":
          description: ZETA ingestion totals and active sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZetaOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: ZETA storage is not initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/zeta/tickets:
    get:
      operationId: listZetaTickets
      tags: [admin]
      summary: List persisted ZETA tickets
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: ticketId
          in: query
          required: false
          description: Literal substring match; SQL wildcard characters are escaped.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            multipleOf: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            multipleOf: 1
            default: 25
      responses:
        "200":
          description: A page of ZETA ticket summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZetaTicketPage"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "500":
          description: A stored ticket is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: ZETA storage is not initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/zeta/ticket:
    get:
      operationId: getZetaTicket
      tags: [admin]
      summary: Get one persisted ZETA ticket
      parameters:
        - name: sourceId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: ticketId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Persisted ZETA ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZetaTicketDetail"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not an operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "500":
          description: The stored ticket is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: ZETA storage is not initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Machine API key credential. Clerk user authentication is not accepted.
    BearerAuth:
      type: http
      scheme: bearer
      description: Machine bearer credential. Clerk user authentication is not accepted.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TicketIngestionInput:
      type: object
      additionalProperties: false
      required: [ticketId, timestamp, stake, totalOdds, legs]
      properties:
        ticketId:
          type: string
          format: uuid
          maxLength: 36
        timestamp:
          type: string
          format: date-time
          maxLength: 64
        userIdHash:
          type: string
          maxLength: 128
          pattern: '^[a-fA-F0-9]{32,128}$'
        stake:
          type: string
          maxLength: 20
          pattern: '^(0|[1-9]\d{0,11})(\.\d{1,6})?$'
        totalOdds:
          type: string
          maxLength: 20
          pattern: '^([1-9]\d{0,3})(\.\d{1,6})?$'
        potentialPayout:
          type: string
          maxLength: 25
          pattern: '^(0|[1-9]\d{0,11})(\.\d{1,6})?$'
        legs:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/TicketIngestionLeg"
    TicketIngestionLeg:
      type: object
      additionalProperties: false
      required: [legId, eventSlug, market, targetValue, actualValue, status]
      properties:
        legId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^\S.*$'
        eventSlug:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^\S.*$'
        market:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^\S.*$'
        selection:
          type: string
          maxLength: 128
        targetValue:
          type: string
          maxLength: 20
          pattern: '^(?!-0(\.0+)?$)-?(0|[1-9]\d{0,11})(\.\d{1,6})?$'
        actualValue:
          type: string
          maxLength: 20
          pattern: '^(?!-0(\.0+)?$)-?(0|[1-9]\d{0,11})(\.\d{1,6})?$'
        marginDelta:
          type: string
          maxLength: 20
          pattern: '^(?!-0(\.0+)?$)-?(0|[1-9]\d{0,11})(\.\d{1,6})?$'
        status:
          type: string
          enum: [WIN, LOSS, PUSH, VOID]
    TicketIngestionResult:
      type: object
      additionalProperties: false
      required:
        [
          success,
          idempotentReplay,
          ticketId,
          sourceId,
          computedFinancials,
          normalizedLegsCount,
          persistedAt,
        ]
      properties:
        success:
          type: boolean
          const: true
        idempotentReplay:
          type: boolean
        ticketId:
          type: string
        sourceId:
          type: string
        computedFinancials:
          $ref: "#/components/schemas/TicketComputedFinancials"
        normalizedLegsCount:
          type: integer
        persistedAt:
          type: string
          format: date-time
    TicketComputedFinancials:
      type: object
      additionalProperties: false
      required: [stakeScaled, oddsScaled, payoutScaled]
      properties:
        stakeScaled:
          type: string
          pattern: '^\d+$'
        oddsScaled:
          type: string
          pattern: '^\d+$'
        payoutScaled:
          type: string
          pattern: '^\d+$'
    TicketIngestionError:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        existingReceipt:
          $ref: "#/components/schemas/TicketIngestionResult"
    TicketReceipt:
      type: object
      additionalProperties: false
      required: [computedFinancials, normalizedLegsCount, persistedAt]
      properties:
        computedFinancials:
          $ref: "#/components/schemas/TicketComputedFinancials"
        normalizedLegsCount:
          type: integer
          minimum: 1
          multipleOf: 1
        persistedAt:
          type: string
          description: ISO-8601 timestamp retained as a string.
