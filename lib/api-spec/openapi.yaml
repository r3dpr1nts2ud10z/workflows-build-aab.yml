          type: object
          required: [status, configured, chatsToday, insightsToday]
          properties:
            status:
              type: string
              enum: [online, degraded, offline]
            configured:
              type: boolean
            chatsToday:
              type: integer
            insightsToday:
              type: integer
            lastActivityAt:
              type: ["string", "null"]
            lastError:
              type: ["string", "null"]
        risk:
          type: object
          required:
            [
              maxGrossSettlement,
              dailyCeiling,
              todaySettledNet,
              ceilingUtilizationPct,
              reviewThreshold,
              treasuryBalance,
              reserveCapacity,
              reserveMultiple,
              reserveBuffer,
              pendingReviewCount,
              pendingReviewExposure,
            ]
          properties:
            maxGrossSettlement:
              type: number
            dailyCeiling:
              type: number
            todaySettledNet:
              type: number
            ceilingUtilizationPct:
              type: number
            reviewThreshold:
              type: number
            treasuryBalance:
              type: number
            reserveCapacity:
              type: number
              description: Max single net settlement currently covered by the reserve gate
            reserveMultiple:
              type: number
              description: Leverage allowed over treasury (1 = never pay more than banked)
            reserveBuffer:
              type: number
              description: Treasury floor that must remain after any auto-payout
            pendingReviewCount:
              type: integer
            pendingReviewExposure:
              type: number
              description: Sum of quoted net settlements awaiting review
        solvency:
          type: object
          required:
            [
              treasuryBalance,
              rolling24hPayouts,
              mrr,
              activeSubscribers,
              settlementPaused,
            ]
          properties:
            treasuryBalance:
              type: number
              description: Real spendable cash (subscription revenue in − payouts out)
            rolling24hPayouts:
              type: number
              description: Net settlement payouts in the last 24 hours
            mrr:
              type: number
              description: Monthly recurring revenue from active paid subscriptions
            activeSubscribers:
              type: integer
            settlementPaused:
              type: boolean
