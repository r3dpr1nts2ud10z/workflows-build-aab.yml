          type: object
          required: [today, yesterday, changePct]
          properties:
            today:
              type: integer
            yesterday:
              type: integer
            changePct:
              type: ["number", "null"]
        trafficSources:
          type: array
          description: Unique visitors per acquisition source (last 14 days)
          items:
            type: object
            required: [source, visitors]
            properties:
              source:
                type: string
              visitors:
                type: integer
        conversion:
          type: object
          required:
            [
              totalUsers,
              submittingUsers,
              signupToSubmitRate,
              totalReceipts,
              settledReceipts,
              settlementRate,
            ]
          properties:
            totalUsers:
              type: integer
            submittingUsers:
              type: integer
            signupToSubmitRate:
              type: ["number", "null"]
            totalReceipts:
              type: integer
            settledReceipts:
              type: integer
            settlementRate:
              type: ["number", "null"]
