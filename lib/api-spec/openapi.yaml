          type: number
          description: Cumulative operator fee earnings
        recentFees:
          type: array
          items:
            type: object
            required: [id, source, amount, createdAt]
            properties:
              id:
                type: integer
              source:
                type: string
              amount:
                type: number
              description:
                type: ["string", "null"]
              createdAt:
                type: string
        visitors:
          type: array
          description: Unique visitors per day (last 14 days)
          items:
            $ref: "#/components/schemas/DailyMetricPoint"
