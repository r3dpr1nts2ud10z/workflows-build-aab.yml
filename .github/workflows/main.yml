name: Build Red Spade Network AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android App Bundle
        run: |
          set -e
          if [ ! -f "settings.gradle" ]; then
            echo "Generating default Gradle project..."
            echo "rootProject.name = 'RedSpade'" > settings.gradle
            echo "include ':app'" >> settings.gradle
            
            mkdir -p app/src/main
            echo "plugins { id 'com.android.application' }" > app/build.gradle
            echo "android { namespace 'com.redspade.app'; compileSdk 34; defaultConfig { applicationId 'com.redspade.app'; minSdk 21; targetSdk 34; } }" >> app/build.gradle
            
            echo "<manifest xmlns:android='http://schemas.android.com/apk/res/android'><application android:label='Red Spade'><activity android:name='.MainActivity' android:exported='true'><intent-filter><action android:name='android.intent.action.MAIN'/><category android:name='android.intent.category.LAUNCHER'/></intent-filter></activity></application></manifest>" > app/src/main/AndroidManifest.xml
            
            mkdir -p app/src/main/java/com/redspade/app
            echo "package com.redspade.app; import android.app.Activity; import android.os.Bundle; public class MainActivity extends Activity { @Override protected void onCreate(Bundle s) { super.onCreate(s); } }" > app/src/main/java/com/redspade/app/MainActivity.java
          fi

          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi

          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-spade-network-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
