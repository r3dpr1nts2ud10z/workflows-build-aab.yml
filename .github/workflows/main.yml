name: Build Red Spade Network APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
- uses: actions/checkout@v4
      with:
        submodules: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Release Signing & Build APK
        working-directory: ./workspace-android
        run: |
          # Inject debug signing into release buildType if no signingConfig exists
          if ! grep -q "signingConfig" app/build.gradle; then
            sed -i '/buildTypes {/a \        release { signingConfig signingConfigs.debug }' app/build.gradle
          fi
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-spade-network-signed-apk
          path: workspace-android/app/build/outputs/apk/release/*.apk
<uses-feature android:name="android.software.leanback" android:required="false" />
<uses-feature android:name="android.hardware.touchscreen" android:required="false" />
<category android:name="android.intent.category.LEANBACK_LAUNCHER" />
- uses: actions/checkout@v4
  with:
    submodules: false
