name: Build Red Spade Network AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate or Generate Gradle Wrapper and Build AAB
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No build.gradle found in repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating wrapper..."
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-spade-network-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
