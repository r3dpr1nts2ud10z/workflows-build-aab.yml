name: Build Red Spade Network AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Android TWA Wrapper & Build AAB
        run: |
          # Check if an Android project already exists
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "No existing Android Gradle project found. Generating Android wrapper..."
            
            # Create a clean Android project structure
            mkdir -p android/app/src/main
            cd android
            
            # Create build.gradle for the app module
            cat << 'EOF' > app/build.gradle
            plugins {
                id 'com.android.application'
            }
            android {
                namespace 'com.redspade.network.twa'
                compileSdk 34
                defaultConfig {
                    applicationId "com.redspade.network.twa"
                    minSdk 21
                    targetSdk 34
                    versionCode 1
                    versionName "1.0"
                }
                buildTypes {
                    release {
                        minifyEnabled false
                    }
                }
            }
            dependencies {
                implementation 'androidx.appcompat:appcompat:1.6.1'
            }
            EOF

            # Create root build.gradle
            cat << 'EOF' > build.gradle
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:8.2.0'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            task clean(type: Delete) {
                delete rootProject.build, build
            }
            EOF

            # Create settings.gradle
            cat << 'EOF' > settings.gradle
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "RedSpadeTWA"
            include ':app'
            EOF

            # Create AndroidManifest.xml
            mkdir -p app/src/main
            cat << 'EOF' > app/src/main/AndroidManifest.xml
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-permission android:name="android.permission.INTERNET" />
                <application
                    android:allowBackup="true"
                    android:icon="@mipmap/ic_launcher"
                    android:label="Red Spade Network"
                    android:roundIcon="@mipmap/ic_launcher_round"
                    android:supportsRtl="true"
                    android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                    <activity
                        android:name=".MainActivity"
                        android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF

            # Create simple MainActivity placeholder
            mkdir -p app/src/main/java/com/redspade/network/twa
            cat << 'EOF' > app/src/main/java/com/redspade/network/twa/MainActivity.java
            package com.redspade.network.twa;
            import android.os.Bundle;
            import android.webkit.WebView;
            import android.webkit.WebViewClient;
            import androidx.appcompat.app.AppCompatActivity;

            public class MainActivity extends AppCompatActivity {
                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    WebView webView = new WebView(this);
                    webView.getSettings().setJavaScriptEnabled(true);
                    webView.setWebViewClient(new WebViewClient());
                    // Point to your public URL or fallback
                    webView.loadUrl("https://example.com"); 
                    setContentView(webView);
                }
            }
            EOF

            echo "Android wrapper generated successfully."
          else
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            cd "$PROJECT_DIR"
            echo "Found existing project in: $PROJECT_DIR"
          fi

          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi

          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-spade-network-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
