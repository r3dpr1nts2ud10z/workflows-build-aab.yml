name: Build Red Spade Network AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug Repository File Tree
        run: |
          echo "Listing repository structure:"
          find . -maxdepth 3 -not -path '*/.*'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate Gradle Project and Build AAB
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Searching for build.gradle instead..."
            BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
            if [ -z "$BUILD_FILE" ]; then
              echo "Error: No build files found in repository!"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          else
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi
          
          cd "$PROJECT_DIR"
          echo "Working in project directory: $PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper
          fi

          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-spade-network-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
