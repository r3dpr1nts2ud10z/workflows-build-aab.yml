name: Build Red Spade Network AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android App Bundle
        run: |
          set -e
          BUILD_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            echo "Generating default Android project structure..."
            mkdir -p android/app/src/main/java/com/redspade/app
            cd android
            
            cat << 'EOF' > settings.gradle
rootProject.name = "RedSpade"
include ':app'
EOF

            cat << 'EOF' > build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOF

            cat << 'EOF' > app/build.gradle
plugins { id 'com.android.application' }
android {
    namespace 'com.redspade.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.redspade.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
EOF

            mkdir -p app/src/main
            cat << 'EOF' > app/src/main/AndroidManifest.xml
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application android:label="Red Spade">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

            mkdir -p app/src/main/java/com/redspade/app
            cat << 'EOF' > app/src/main/java/com/redspade/app/MainActivity.java
package com.redspade.app;
import android.app.Activity;
import android.os.Bundle
