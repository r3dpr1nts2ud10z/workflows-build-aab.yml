<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RRN // ROAST ROYCE NETWORK TERMINAL</title>
  <style>
    body { background-color: #0a0a0c; color: #00ffcc; font-family: 'Courier New', monospace; margin: 20px; }
    h1 { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
    .terminal-box { border: 1px solid #00ffcc; padding: 15px; background: #111116; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0,255,204,0.1); }
    .stat-line { margin: 8px 0; }
    .highlight { color: #ffcc00; font-weight: bold; }
    .alert { color: #ff0055; font-weight: bold; }
    .badge { background: #ff0055; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
  </style>
</head>
<body>

  <h1>⚡ ROAST ROYCE NETWORK // COMMAND TERMINAL</h1>
  
  <div class="terminal-box">
    <h3>[ BROADCAST STATUS & TELEMETRY ]</h3>
    <div class="stat-line">SYSTEM STATUS: <span id="status" class="highlight">INITIALIZING...</span></div>
    <div class="stat-line">ACTIVE STREAM: <span id="channel">---</span></div>
    <div class="stat-line">VIEW VOLUME: <span id="views" class="highlight">0</span> IMPRESSIONS</div>
    <div class="stat-line">CURRENT DAI AD SLOT: <span id="ad_slot" class="alert">NONE</span></div>
  </div>

  <div class="terminal-box">
    <h3>[ LIQUIDITY & FUNDING INTEGRATION ]</h3>
    <div class="stat-line">BTC FUNDING RATE: <span id="funding" class="highlight">0.00%</span></div>
    <div class="stat-line">PORTFOLIO TRADE EQUITY: $<span id="equity" class="highlight">0.00</span></div>
  </div>

  <div class="terminal-box">
    <h3>[ ACTIVE AD VAULT ]</h3>
    <ul id="vault-list"></ul>
  </div>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);
    
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      
      if (msg.type === 'INIT') {
        renderVault(msg.data.ad_vault);
        updateStats(msg.stats);
      } else if (msg.type === 'TELEMETRY_UPDATE') {
        updateStats(msg.stats);
      }
    };

    function updateStats(stats) {
      document.getElementById('status').innerText = stats.status;
      document.getElementById('channel').innerText = stats.active_channel;
      document.getElementById('views').innerText = stats.view_volume.toLocaleString();
      document.getElementById('ad_slot').innerText = stats.current_ad_slot;
      document.getElementById('funding').innerText = stats.btc_funding_rate + "%";
      document.getElementById('equity').innerText = stats.portfolio_trade_equity.toFixed(2);
    }

    function renderVault(vault) {
      const list = document.getElementById('vault-list');
      list.innerHTML = '';
      vault.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<b>${item.title}</b> <span class="badge">CPM: $${item.bid_cpm}</span> — <i>PSA: "${item.psa_virtue}"</i>`;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
