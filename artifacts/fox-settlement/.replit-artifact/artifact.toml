kind = "video"
previewPath = "/fox-settlement/"
title = "Fox Settlement Ride"
version = "1.0.0"
id = "artifacts/fox-settlement"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/fox-settlement/" ]
localPort = 21527

[services.development]
run = "pnpm --filter @workspace/fox-settlement run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fox-settlement", "run", "build" ]
publicDir = "artifacts/fox-settlement/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21527"
BASE_PATH = "/fox-settlement/"
